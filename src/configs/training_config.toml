[training]
batch_size = 4
max_epochs = 1
lr = 1e-4
base_channels = 64
num_workers = 4
target_channels = 4
condition_channels = 20
checkpoint_dir = "./checkpoints/"
timesteps = 100
channel_mults = [1, 2, 4, 8]
checkpoint_every_n_steps = 1000
log_every_n_step = 100

[dates]
train_blocks = [
  ["1951-01-01", "1960-12-31"],
  ["1963-01-01", "1972-12-31"],
  ["1975-01-01", "1984-12-31"],
  ["1987-01-01", "1996-12-31"],
  ["1999-01-01", "2008-12-31"],
  ["2011-01-01", "2020-12-31"],
  ["2023-01-01", "2032-12-31"],
  ["2035-01-01", "2044-12-31"],
  ["2047-01-01", "2056-12-31"],
  ["2059-01-01", "2068-12-31"],
  ["2071-01-01", "2080-12-31"],
  ["2083-01-01", "2092-12-31"],
  ["2095-01-01", "2100-12-31"]
]

val_blocks = [
  ["1961-01-01", "1962-12-31"],
  ["1973-01-01", "1974-12-31"],
  ["1985-01-01", "1986-12-31"],
  ["1997-01-01", "1998-12-31"],
  ["2009-01-01", "2010-12-31"],
  ["2021-01-01", "2022-12-31"],
  ["2033-01-01", "2034-12-31"],
  ["2045-01-01", "2046-12-31"],
  ["2057-01-01", "2058-12-31"],
  ["2069-01-01", "2070-12-31"],
  ["2081-01-01", "2082-12-31"],
  ["2093-01-01", "2094-12-31"]
]
daily_frequency = true

[preprocessing]
timesteps_per_chunk = 8
temperature_constraints = false
precipitation_scaling = 86400
precipitation_transform = false
residualize_targets = true
wet_day_threshold = 0.5
normalization = 'global'
normalization_stats_path = '/scratch/project_465002687/ec_earth/processed/normalization_stats.nc'
predictors_output = '/scratch/project_465002687/ec_earth/processed/predictors.zarr'
targets_output = '/scratch/project_465002687/ec_earth/processed/targets.zarr'
static_output = '/scratch/project_465002687/ec_earth/processed/static.zarr'

