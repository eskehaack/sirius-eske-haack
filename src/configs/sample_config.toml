[training]
batch_size = 4
max_epochs = 10
lr = 1e-4
base_channels = 64
num_workers = 4
target_channels = 4
condition_channels = 20
checkpoint_dir = "./checkpoints/"
timesteps = 100
channel_mults = [1, 2, 4, 8]
checkpoint_every_n_steps = 0
log_every_n_step = 10

[dates]
train_blocks = [
  ["1951-01-01", "1955-12-31"],
  ["1961-01-01", "1965-12-31"],
]

val_blocks = [
  ["1956-01-01", "1956-12-31"],
  ["1966-01-01", "1966-12-31"],
]
daily_frequency = true

[preprocessing]
timesteps_per_chunk = 8
temperature_constraints = false
precipitation_scaling = 86400
precipitation_transform = false
wet_day_threshold = 0.5
normalization = 'global'
normalization_stats_path = '/scratch/project_465002687/ec_earth/sample/normalization_stats.nc'
predictors_output = '/scratch/project_465002687/ec_earth/sample/predictors.zarr'
targets_output = '/scratch/project_465002687/ec_earth/sample/targets.zarr'
static_output = '/scratch/project_465002687/ec_earth/sample/static.zarr'

[predictors]
vertical_dim_name = "plev"

